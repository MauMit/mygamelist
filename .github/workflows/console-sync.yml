name: Sync Xbox + PlayStation Achievements

# Pulls Xbox achievements (OpenXBL) and PlayStation trophies (PSN) into
# console-data.json / console-summary.json on the user branch.
# Secrets: OPENXBL_KEY and/or PSN_NPSSO (see console/README.md).
# Only games with new progress are re-fetched, so a run takes a minute or two.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: console-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scripts (main)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout console data (user branch)
        uses: actions/checkout@v4
        with:
          ref: user
          path: data
          sparse-checkout: |
            console-data.json
            console-summary.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync achievements
        id: sync
        env:
          OPENXBL_KEY: ${{ secrets.OPENXBL_KEY }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: |
          set +e
          python main/console/sync_console.py --data data
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit to user branch
        working-directory: data
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add console-data.json console-summary.json
          if git diff --cached --quiet; then
            echo "No console changes."
            exit 0
          fi
          git commit -m "Sync console achievements [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin user && git push origin user && exit 0
            sleep 10
          done
          exit 1

      - name: Report platform errors
        if: steps.sync.outputs.code != '0'
        run: |
          echo "::error::One platform failed to sync. Its last good data was kept. See the 'Sync achievements' step for the reason."
          exit 1
